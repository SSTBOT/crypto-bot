[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.venv"]

[phases.install]
cmds = [
  "python -m venv venv",
  "source venv/bin/activate",
  "pip install --no-cache-dir ccxt python-telegram-bot python-dotenv"
]

[start]
cmd = "source venv/bin/activate && python bot_railway.py"
